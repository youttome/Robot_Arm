controller_manager:
  ros__parameters:
    update_rate: 10

    arm_control:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_control:
      #type: forward_command_controller/ForwardCommandController -> to simple control by command line 
      type: joint_trajectory_controller/JointTrajectoryController
      
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster


arm_control:
  ros__parameters:
    joints:
      - joint_1
      - joint_3
      - joint_2

    command_interfaces:
      - position

    state_interfaces:
      - position

    open_loop_control: true
    allow_integration_in_goal_trajectories: true

gripper_control:
  ros__parameters:
    joints:
      - joint_4

    command_interfaces:
      - position

    state_interfaces:
      - position

    open_loop_control: true
    allow_integration_in_goal_trajectories: true

